# Integration-test profile. Never hardcode credentials here: this file is committed.
#
# Point the tests at a THROWAWAY database. ItFlywayConfig runs flyway.clean() before every
# run, so aiming this at the development database would erase it.
#
# Local overrides go in backend/.env.it.properties (git-ignored via .env.*). A file is used
# rather than a classpath resource so a stale copy cannot be packaged into the test jar and
# silently override the environment variables, which is exactly what happened before.
spring.datasource.url=${IT_DB_URL:jdbc:postgresql://127.0.0.1:5432/peoplepay_test}
spring.datasource.username=${IT_DB_USERNAME:postgres}
spring.datasource.password=${IT_DB_PASSWORD:postgres}
spring.config.import=optional:file:./.env.it.properties
spring.flyway.clean-disabled=false
# Test-only AES-256 key: exactly 32 bytes, base64 encoded. Never reuse outside tests.
app.encryption-key=${IT_ENCRYPTION_KEY:cGVvcGxlcGF5MzYwLWludGVncmF0aW9uLXRlc3Qta2U=}
app.mcp.base-url=http://127.0.0.1:9
app.jwt.key-path=./target/it-jwt.pem
# Several integration classes sign in as five roles in a row; the production limit would trip.
app.security.login-attempts=1000
