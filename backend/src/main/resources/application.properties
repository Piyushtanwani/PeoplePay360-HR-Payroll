spring.application.name=peoplepay360-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/peoplepay}
spring.datasource.username=${DB_USER:peoplepay}
spring.datasource.password=${DB_PASSWORD:peoplepay}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.leak-detection-threshold=30000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# Paging. Spring clamps before the controller; common/Paging.java re-clamps and whitelists sort fields.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=200

spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
# Auth and STARTTLS are off for the local mail catcher and on for a real relay.
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

spring.servlet.multipart.enabled=false

server.port=${SERVER_PORT:8080}
server.shutdown=graceful
server.error.include-stacktrace=never
server.error.include-message=never

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
# An unreachable mail relay is an operational warning, not a reason for an orchestrator to restart
# a working application. The admin health page probes SMTP separately and reports it there.
management.health.mail.enabled=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

app.jwt.issuer=${JWT_ISSUER:peoplepay360}
app.jwt.rsa-private-key-pem=${JWT_RSA_PRIVATE_KEY_PEM:}
app.jwt.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:43200}
app.jwt.delegated-ttl-seconds=${JWT_DELEGATED_TTL_SECONDS:300}
app.jwt.key-path=${JWT_KEY_PATH:./keys/jwt.pem}
app.mcp.base-url=${MCP_BASE_URL:http://localhost:8000}
app.mcp.gateway-secret=${MCP_GATEWAY_SECRET:change-me-32-chars-minimum-value!}
app.encryption-key=${APP_ENCRYPTION_KEY:}
app.currency=${APP_CURRENCY:INR}
app.timezone=${APP_TIMEZONE:Asia/Kolkata}
app.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.mail-from=${MAIL_FROM:payroll@peoplepay360.local}
app.chat.rate-limit-per-10-min=${CHAT_RATE_LIMIT_PER_10_MIN:30}
app.chat.max-tool-calls-per-turn=${CHAT_MAX_TOOL_CALLS_PER_TURN:8}
app.ai.default-provider=${AI_DEFAULT_PROVIDER:OLLAMA}
app.ai.default-base-url=${AI_DEFAULT_BASE_URL:http://localhost:11434/v1}
app.ai.default-api-key=${AI_DEFAULT_API_KEY:}
app.ai.default-model=${AI_DEFAULT_MODEL:llama3.1:8b}
app.env=${APP_ENV:dev}
app.company-name=${COMPANY_NAME:OXP Pvt Ltd}

app.app-base-url=${APP_BASE_URL:http://localhost:5173}
app.invite-ttl-hours=${INVITE_TTL_HOURS:48}

# Attendance classification. Surfaced verbatim by GET /api/attendance/rules so the in-app
# help panel always shows the values the classifier actually uses.
app.attendance.late-grace-minutes=${ATTENDANCE_LATE_GRACE_MINUTES:10}
app.attendance.overtime-threshold-minutes=${ATTENDANCE_OVERTIME_THRESHOLD_MINUTES:30}
app.attendance.missing-checkout-after-minutes=${ATTENDANCE_MISSING_CHECKOUT_AFTER_MINUTES:240}

# Net pay moving more than this percentage against the previous payslip raises a payrun warning.
app.payroll.variance-threshold-pct=${PAYROLL_VARIANCE_THRESHOLD_PCT:25}

# Sign-in attempts per email and per IP per 15 minutes.
app.security.login-attempts=${LOGIN_ATTEMPTS:10}
