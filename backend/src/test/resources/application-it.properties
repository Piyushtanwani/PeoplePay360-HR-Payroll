# Integration-test profile. Never hardcode credentials here: this file is committed.
# Override locally with environment variables or a git-ignored application-it-local.properties.
spring.datasource.url=${IT_DB_URL:jdbc:postgresql://127.0.0.1:5432/peoplepay_test}
spring.datasource.username=${IT_DB_USERNAME:postgres}
spring.datasource.password=${IT_DB_PASSWORD:postgres}
spring.flyway.clean-disabled=false
# Test-only key. Generate a real one per environment; never reuse this outside tests.
app.encryption-key=${IT_ENCRYPTION_KEY:dGVzdC1vbmx5LWtleS0zMi1ieXRlcy1sb25nISE=}
app.mcp.base-url=http://127.0.0.1:9
app.jwt.key-path=./target/it-jwt.pem
spring.config.import=optional:classpath:application-it-local.properties
