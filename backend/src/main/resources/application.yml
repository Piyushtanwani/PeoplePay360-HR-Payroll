spring:
  application:
    name: peoplepay360-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/peoplepay}
    username: ${DB_USER:peoplepay}
    password: ${DB_PASSWORD:peoplepay}
    hikari:
      maximum-pool-size: 10
      leak-detection-threshold: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: false
  flyway:
    enabled: true
    validate-on-migrate: true
    baseline-on-migrate: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  servlet:
    multipart:
      enabled: false
  threads:
    virtual:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    issuer: ${JWT_ISSUER:peoplepay360}
    rsa-private-key-pem: ${JWT_RSA_PRIVATE_KEY_PEM:}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:43200}
    delegated-ttl-seconds: ${JWT_DELEGATED_TTL_SECONDS:300}
    key-path: ${JWT_KEY_PATH:./keys/jwt.pem}
  mcp:
    base-url: ${MCP_BASE_URL:http://localhost:8000}
    gateway-secret: ${MCP_GATEWAY_SECRET:change-me-32-chars-minimum-value!}
  encryption-key: ${APP_ENCRYPTION_KEY:}
  currency: ${APP_CURRENCY:INR}
  timezone: ${APP_TIMEZONE:Asia/Kolkata}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  mail-from: ${MAIL_FROM:payroll@peoplepay360.local}
  chat:
    rate-limit-per-10-min: ${CHAT_RATE_LIMIT_PER_10_MIN:30}
    max-tool-calls-per-turn: ${CHAT_MAX_TOOL_CALLS_PER_TURN:8}
  ai:
    default-provider: ${AI_DEFAULT_PROVIDER:OLLAMA}
    default-base-url: ${AI_DEFAULT_BASE_URL:http://host.docker.internal:11434/v1}
    default-api-key: ${AI_DEFAULT_API_KEY:}
    default-model: ${AI_DEFAULT_MODEL:llama3.1:8b}
  env: ${APP_ENV:dev}
